title: Baimuratov Hints
description: >-
  Технические хаки, разборы инструментов и подводные камни — кратко и по делу.

lang: ru
url: "https://hints.baimuratov.app"

theme: minima
minima:
  skin: auto
  date_format: "%Y-%m-%d"

email: hints@baimuratov.app

permalink: /:year/:title/
timezone: Europe/Moscow

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

header_pages:
  - about.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - README.md
